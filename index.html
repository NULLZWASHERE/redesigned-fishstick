<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Classes</title>
  <link rel="icon" id="site-favicon" href="https://ssl.gstatic.com/classroom/favicon.png">
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #ef4444;
      --primary-hover: #dc2626;
      --primary-glow: rgba(239, 68, 68, 0.45);
      --primary-light: rgba(239, 68, 68, 0.15);
      --bg: #090304;
      --surface: #14080a;
      --surface-hover: #1f0b0f;
      --border: #3b1016;
      --border-accent: #6b1520;
      --text: #fef2f2;
      --text-muted: #b98a8e;
      --radius: 12px;
      --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.7);
      --shadow-xl: 0 18px 24px -5px rgba(0, 0, 0, 0.85);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      background-image:
        linear-gradient(rgba(239, 68, 68, 0.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(239, 68, 68, 0.05) 1px, transparent 1px);
      background-size: 50px 50px;
      color: var(--text);
      font-family: 'Inter', system-ui, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: rgba(14, 5, 7, 0.95);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 100;
      backdrop-filter: blur(14px);
      box-shadow: 0 4px 20px rgba(239, 68, 68, 0.15);
    }

    .header-content {
      max-width: 1280px;
      margin: 0 auto;
      padding: 0.85rem 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1.25rem;
    }

    .logo-container {
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
    }

    .logo-text {
      font-family: 'Press Start 2P', monospace;
      font-size: 1.05rem;
      letter-spacing: 1px;
      color: var(--primary);
      text-shadow: 0 0 12px var(--primary-glow);
    }

    .search-container {
      display: flex;
      flex: 1;
      max-width: 550px;
      gap: 0.75rem;
    }

    #searchBar {
      flex: 1;
      padding: 0.7rem 1rem;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: rgba(20, 8, 10, 0.85);
      color: var(--text);
      font-size: 14px;
      outline: none;
      transition: all 0.2s ease;
    }

    #searchBar:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px var(--primary-light);
    }

    #sortOptions, #filterOptions {
      padding: 0.7rem 2.2rem 0.7rem 1rem;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--surface);
      color: var(--text-muted);
      font-size: 14px;
      cursor: pointer;
      outline: none;
      -webkit-appearance: none;
      appearance: none;
      background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23ef4444' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
      background-repeat: no-repeat;
      background-position: right 0.8rem center;
      background-size: 1rem;
    }

    .control-buttons {
      display: flex;
      gap: 0.5rem;
    }

    .control-button {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      cursor: pointer;
      width: 42px;
      height: 42px;
      border-radius: var(--radius);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
    }

    .control-button:hover {
      background: var(--surface-hover);
      border-color: var(--primary);
      box-shadow: 0 0 10px var(--primary-glow);
    }

    .control-button svg {
      width: 20px;
      height: 20px;
      fill: var(--primary);
    }

    main {
      max-width: 1280px;
      width: 100%;
      margin: 0 auto;
      padding: 2rem 1.5rem 6rem;
      flex: 1;
    }

    .zone-section {
      margin-bottom: 2.5rem;
    }

    .zone-header-title {
      font-size: 1.25rem;
      font-weight: 700;
      margin-bottom: 1.25rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      color: #fff;
    }

    .zone-header-title::before {
      content: '';
      width: 5px;
      height: 18px;
      background: var(--primary);
      box-shadow: 0 0 10px var(--primary);
      border-radius: 2px;
      display: inline-block;
    }

    .zone-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 1.25rem;
    }

    .zone-item {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1), border-color 0.25s ease, box-shadow 0.25s ease;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    .zone-item:hover {
      transform: translateY(-6px);
      border-color: var(--primary);
      box-shadow: 0 10px 25px -5px rgba(239, 68, 68, 0.35);
    }

    .zone-item img {
      width: 100%;
      aspect-ratio: 1;
      object-fit: cover;
      display: block;
      background: #0d0405;
    }

    .zone-item .zone-label {
      padding: 0.65rem 0.75rem;
      font-weight: 600;
      font-size: 13px;
      text-align: center;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      border-top: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
    }

    .zone-item:hover .zone-label {
      color: #fff;
      border-top-color: var(--border-accent);
    }

    /* Fullscreen Game Frame */
    #zoneViewer {
      position: fixed;
      inset: 0;
      background: #000;
      z-index: 1000;
      display: none;
      flex-direction: column;
    }

    .viewer-navbar {
      background: #0f0507;
      color: #fff;
      padding: 0.5rem 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
    }

    .viewer-title-area h2 {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--primary);
    }

    .viewer-title-area a {
      font-size: 12px;
      color: var(--text-muted);
      text-decoration: none;
    }

    .viewer-controls {
      display: flex;
      gap: 0.6rem;
    }

    .viewer-btn {
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid var(--border);
      color: #fff;
      padding: 0.5rem 0.85rem;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      transition: background 0.15s, border-color 0.15s;
    }

    .viewer-btn:hover {
      background: var(--primary);
      border-color: var(--primary);
    }

    #zoneFrame {
      flex: 1;
      width: 100%;
      height: 100%;
      border: none;
    }

    /* Settings Modal */
    #popupOverlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(8px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 2000;
    }

    .popup {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      width: 100%;
      max-width: 440px;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
      box-shadow: 0 0 30px rgba(239, 68, 68, 0.2);
    }

    .popup input[type="text"] {
      width: 100%;
      padding: 0.75rem;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: #fff;
      outline: none;
    }

    .popup input[type="text"]:focus {
      border-color: var(--primary);
    }

    .action-btn {
      background: var(--primary);
      color: #fff;
      border: none;
      padding: 0.75rem;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 0 15px rgba(239, 68, 68, 0.4);
    }

    .action-btn:hover {
      background: var(--primary-hover);
    }
  </style>
</head>
<body>

  <header>
    <div class="header-content">
      <div class="logo-container" onclick="location.reload()">
        <span class="logo-text">Redwing g$m4s</span>
      </div>

      <div class="search-container">
        <input type="text" id="searchBar" placeholder="Search games..." oninput="filterZones()">
        <select id="sortOptions" onchange="sortZones()">
          <option value="name">Name</option>
          <option value="id">ID</option>
        </select>
        <select id="filterOptions" onchange="filterZonesByTag()">
          <option value="none">All Categories</option>
        </select>
      </div>

      <div class="control-buttons">
        <button class="control-button" title="Refresh" onclick="listZones()">
          <svg viewBox="0 0 24 24"><path d="M12 4V1L8 5l4 4V6c3.31 0 6 2.69 6 6 0 1.01-.25 1.97-.7 2.8l1.46 1.46A7.93 7.93 0 0020 12c0-4.42-3.58-8-8-8zm0 14c-3.31 0-6-2.69-6-6 0-1.01.25-1.97.7-2.8L5.24 7.74A7.93 7.93 0 004 12c0 4.42 3.58 8 8 8v3l4-4-4-4v3z"/></svg>
        </button>
        <button class="control-button" title="Stealth / Cloak" onclick="openSettings()">
          <svg viewBox="0 0 24 24"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58a.49.49 0 00.12-.61l-1.92-3.32a.488.488 0 00-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54a.484.484 0 00-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58a.488.488 0 00-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg>
        </button>
      </div>
    </div>
  </header>

  <main>
    <div class="zone-section" id="featuredSection">
      <div class="zone-header-title" id="featuredTitle">Featured</div>
      <div class="zone-grid" id="featuredZones"></div>
    </div>

    <div class="zone-section">
      <div class="zone-header-title" id="allTitle">All Games</div>
      <div class="zone-grid" id="container">Loading games...</div>
    </div>
  </main>

  <div id="zoneViewer">
    <div class="viewer-navbar">
      <div class="viewer-title-area">
        <h2 id="zoneName">Game</h2>
        <a id="zoneAuthor" href="#" target="_blank">Author</a>
      </div>
      <div class="viewer-controls">
        <button class="viewer-btn" onclick="fullscreenZone()">Fullscreen</button>
        <button class="viewer-btn" onclick="aboutBlank()">About:Blank</button>
        <button class="viewer-btn" onclick="closeZone()">Close</button>
      </div>
    </div>
    <iframe id="zoneFrame"></iframe>
  </div>

  <div id="popupOverlay">
    <div class="popup">
      <h3 style="color: var(--primary);">Stealth & Cloaking</h3>
      <p style="font-size: 13px; color: var(--text-muted);">Configure your disguise or spawn inside an about:blank shell.</p>
      <input type="text" id="cloakNameInput" placeholder="Custom Tab Title..." oninput="cloakName(this.value)">
      <input type="text" id="cloakIconInput" placeholder="Custom Favicon URL..." oninput="cloakIcon(this.value)">
      <button class="action-btn" onclick="launchBlankSelf()">Open Portal in About:Blank</button>
      <button class="viewer-btn" onclick="closeSettings()">Exit</button>
    </div>
  </div>

  <script>
    const zonesURL = "https://cdn.jsdelivr.net/gh/NULLZWASHERE/assets@main/zones.json";
    const coverURL = "https://cdn.jsdelivr.net/gh/freebuisness/covers@main/";
    const htmlURL = "https://cdn.jsdelivr.net/gh/freebuisness/html@main/";

    function zoneURL(u) {
      return (u + "").replace("{COVER_URL}", coverURL).replace("{HTML_URL}", htmlURL);
    }

    let zones = [];
    const container = document.getElementById('container');
    const featuredContainer = document.getElementById('featuredZones');
    const zoneViewer = document.getElementById('zoneViewer');
    let zoneFrame = document.getElementById('zoneFrame');
    let currentLoadedZone = null;

    async function listZones() {
      try {
        const response = await fetch(zonesURL + "?t=" + Date.now());
        zones = await response.json();
        
        if (zones.length > 0) zones[0].featured = true;

        populateTags();
        sortZones();
      } catch (err) {
        container.innerHTML = "Error loading game catalog: " + err;
      }
    }

    function populateTags() {
      let tags = [];
      zones.forEach(z => {
        if (Array.isArray(z.special)) tags.push(...z.special);
      });
      tags = [...new Set(tags)];
      const filter = document.getElementById('filterOptions');
      filter.innerHTML = '<option value="none">All Categories</option>';
      tags.forEach(t => {
        const opt = document.createElement('option');
        opt.value = t;
        opt.textContent = t.charAt(0).toUpperCase() + t.slice(1);
        filter.appendChild(opt);
      });
    }

    function sortZones() {
      const criteria = document.getElementById('sortOptions').value;
      if (criteria === 'name') zones.sort((a, b) => a.name.localeCompare(b.name));
      if (criteria === 'id') zones.sort((a, b) => a.id - b.id);

      const featured = zones.filter(z => z.featured);
      renderGrid(featured, featuredContainer);
      renderGrid(zones, container);

      document.getElementById('featuredTitle').textContent = `Featured (${featured.length})`;
      document.getElementById('allTitle').textContent = `All Games (${zones.length})`;
    }

    function renderGrid(list, targetElement) {
      targetElement.innerHTML = list.map(game => `
        <div class="zone-item" onclick='openZone(${JSON.stringify(game)})'>
          <img src="${zoneURL(game.cover)}" alt="${game.name}" loading="lazy">
          <div class="zone-label">${game.name}</div>
        </div>
      `).join('');
    }

    function filterZones() {
      const q = document.getElementById('searchBar').value.toLowerCase();
      const filtered = zones.filter(z => z.name.toLowerCase().includes(q));
      renderGrid(filtered, container);
    }

    function filterZonesByTag() {
      const tag = document.getElementById('filterOptions').value;
      if (tag === 'none') {
        renderGrid(zones, container);
      } else {
        const filtered = zones.filter(z => z.special && z.special.includes(tag));
        renderGrid(filtered, container);
      }
    }

    const BASE_TAG_RE = /<base\b[^>]*>/i;
    function injectZoneBase(html, url) {
      const folder = url.substring(0, url.lastIndexOf('/') + 1);
      const tag = `<base href="${folder}">`;
      if (BASE_TAG_RE.test(html)) return html.replace(BASE_TAG_RE, tag);
      if (/<head[^>]*>/i.test(html)) return html.replace(/<head[^>]*>/i, m => m + tag);
      return tag + html;
    }

    function openZone(game) {
      currentLoadedZone = game;
      const url = zoneURL(game.url);

      if (game.url.startsWith("http")) {
        window.open(game.url, "_blank");
        return;
      }

      fetch(url + "?t=" + Date.now())
        .then(res => {
          if (!res.ok) throw new Error(`HTTP error: ${res.status}`);
          return res.text();
        })
        .then(html => {
          const finalHtml = injectZoneBase(html, url);

          let frame = document.getElementById("zoneFrame");
          if (!frame) {
            frame = document.createElement("iframe");
            frame.id = "zoneFrame";
            zoneViewer.appendChild(frame);
          }

          frame.removeAttribute("src");
          frame.srcdoc = finalHtml;

          document.getElementById('zoneName').textContent = game.name;
          document.getElementById('zoneAuthor').textContent = game.author ? "by " + game.author : "";
          if (game.authorLink) {
            document.getElementById('zoneAuthor').href = game.authorLink;
          } else {
            document.getElementById('zoneAuthor').removeAttribute('href');
          }

          zoneViewer.style.display = "flex";
        })
        .catch(err => alert("Error opening game: " + err));
    }

    function closeZone() {
      zoneViewer.style.display = "none";
      let frame = document.getElementById("zoneFrame");
      if (frame) {
        frame.removeAttribute("srcdoc");
        frame.src = "about:blank";
      }
    }

    function fullscreenZone() {
      const frame = document.getElementById("zoneFrame");
      if (frame) {
        if (frame.requestFullscreen) frame.requestFullscreen();
        else if (frame.webkitRequestFullscreen) frame.webkitRequestFullscreen();
      }
    }

    function aboutBlank() {
      if (!currentLoadedZone) return;
      const win = window.open("about:blank", "_blank");
      if (!win) return alert("Pop-up blocked. Allow pop-ups to open in stealth mode.");
      const url = zoneURL(currentLoadedZone.url);
      fetch(url + "?t=" + Date.now())
        .then(res => res.text())
        .then(html => {
          win.document.open();
          win.document.write(injectZoneBase(html, url));
          win.document.close();
        });
    }

    function launchBlankSelf() {
      const win = window.open('about:blank', '_blank');
      if (!win) return alert('Allow pop-ups to open in stealth mode.');
      const iframe = win.document.createElement('iframe');
      iframe.style.position = 'fixed';
      iframe.style.inset = '0';
      iframe.style.width = '100%';
      iframe.style.height = '100%';
      iframe.style.border = 'none';
      iframe.src = window.location.href;
      win.document.body.style.margin = '0';
      win.document.body.appendChild(iframe);
      window.location.replace('https://classroom.google.com');
    }

    function openSettings() { document.getElementById('popupOverlay').style.display = 'flex'; }
    function closeSettings() { document.getElementById('popupOverlay').style.display = 'none'; }

    function cloakName(name) { document.title = name || "Redwing g$m4s"; }
    function cloakIcon(url) {
      let link = document.querySelector("link[rel*='icon']") || document.createElement('link');
      link.type = 'image/x-icon';
      link.rel = 'shortcut icon';
      link.href = url || "https://ssl.gstatic.com/classroom/favicon.png";
      document.head.appendChild(link);
    }

    window.addEventListener('keydown', (e) => {
      if (e.key === '`' || e.key === 'Escape') {
        window.location.replace('https://classroom.google.com');
      }
    });

    listZones();
  </script>
</body>
</html>
